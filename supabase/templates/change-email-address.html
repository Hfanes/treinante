<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your Treinante email change</title>
  </head>
  <body style="margin:0;background:#29261f;color:#d8ca9f;font-family:Inter,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#29261f;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;border:1px solid #514c3e;border-top-color:#d4bd7c;background:#302d25;">
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 12px;color:#b39c65;font-family:'Space Mono',Consolas,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;">Treinante</p>
                <h1 style="margin:0 0 16px;color:#e6d7aa;font-family:Georgia,serif;font-size:36px;font-weight:500;line-height:1.05;">Confirm new email</h1>
                <p style="margin:0 0 12px;color:#d8ca9f;font-size:16px;line-height:1.6;">Confirm that you want to use this address for your Treinante account:</p>
                <p style="margin:0 0 24px;color:#e6d7aa;font-family:'Space Mono',Consolas,monospace;font-size:14px;line-height:1.6;word-break:break-word;">{{ .NewEmail }}</p>
                <p style="margin:0 0 28px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#d4bd7c;color:#29261f;font-weight:700;text-decoration:none;border-radius:2px;padding:13px 18px;">Confirm email change</a>
                </p>
                <p style="margin:0 0 12px;color:#8f866f;font-size:13px;line-height:1.6;">This link expires shortly and can be used once.</p>
                <p style="margin:0;color:#8f866f;font-size:13px;line-height:1.6;">If you did not request this change, keep using {{ .Email }} and ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
